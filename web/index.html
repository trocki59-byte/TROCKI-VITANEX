<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VİTANEX">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>TROÇKİ VİTANEX</title>
<meta name="theme-color" content="#0B4FD6">
<meta name="description" content="TROÇKİ VİTANEX — Kişisel Yaşam Yönetim Sistemi. Hayatını Sen Yönet.">
<style>
:root{
  --nav:#fff;--hero:#ffffffe6;--p:#0B4FD6;--pd:#0A2E8A;--a:#1E88FF;--pl:#E6EEFC;--bg:#F2F6FC;--card:#fff;--tx:#0E1B3D;--mu:#5B6B8C;--ln:#E3EAF5;
  --g:#22B573;--o:#FF8A1F;--r:#F0384B;--stage:#DDE5F2;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--stage);font-family:Roboto,"Segoe UI",system-ui,sans-serif;color:var(--tx);-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0}
input,select,textarea{font:inherit;color:var(--tx)}
.stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px 16px 24px;gap:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.toolbar .t{font-weight:700;color:var(--pd);margin-right:6px}
.tb{background:#fff;color:var(--p);padding:8px 14px;border-radius:18px;font-weight:700;font-size:13px;box-shadow:0 1px 3px #0b4fd622}
.tb.on{background:var(--p);color:#fff}
.device{background:#0d1530;border-radius:38px;padding:10px;box-shadow:0 20px 50px #0a2e8a44;transition:width .25s}
.device.phone{width:min(400px,100%)}
.device.tablet{width:min(1080px,100%);border-radius:28px}
.screen{background:var(--bg);border-radius:30px;overflow:hidden;height:min(820px,calc(100vh - 90px));display:flex;flex-direction:column;position:relative}
.tablet .screen{border-radius:20px;height:min(720px,calc(100vh - 90px))}
.screen.dark{--bg:#0D1424;--card:#18233A;--tx:#E8EEFA;--mu:#9AA8C7;--ln:#2A3854;--pl:#1E2D4D;--pd:#8FB8FF;--nav:#121B2E;--hero:#121B2Ed9;--p:#3D7BFF}
.screen.dark .chip:not(.on),.screen.dark .btn2{color:var(--pd)}
.screen{color:var(--tx)}
html,body{background:var(--bg0,#F2F6FC)}
body.dark{--bg0:#0D1424}
.device,.device.tablet{width:100%!important;padding:0;border-radius:0;box-shadow:none;background:none}
.screen{border-radius:0!important;height:100vh!important;height:100dvh!important;max-width:100%}
.tablet .content{padding-left:max(18px,calc((100vw - 1280px)/2));padding-right:max(18px,calc((100vw - 1280px)/2))}
.tabs{padding-bottom:env(safe-area-inset-bottom)}
.fab{bottom:calc(72px + env(safe-area-inset-bottom))!important}
.screen{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
body{-webkit-user-select:none;user-select:none;overscroll-behavior:none}
input,textarea,select{-webkit-user-select:text;user-select:text;font-size:16px!important}
.ios-tip{position:absolute;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));background:var(--card);color:var(--tx);border-radius:16px;padding:12px 14px;box-shadow:0 8px 24px #0006;z-index:35;font-size:14px;display:flex;gap:10px;align-items:center}
.ios-tip b{color:var(--p)}
.ios-tip button{background:none;font-size:20px;color:var(--mu)}
@media print{body *{visibility:hidden}}
.sbar{background:var(--p);color:#fff;font-size:12px;display:flex;justify-content:space-between;padding:6px 18px;font-weight:600}
.nav{background:var(--nav);display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--ln);font-weight:700;font-size:18px;color:var(--pd)}
.nav button{background:none;font-size:24px;color:var(--pd);line-height:1;padding:0 6px}
.content{flex:1;overflow-y:auto;padding:14px 14px 90px}
.tabs{background:var(--nav);display:flex;border-top:1px solid var(--ln)}
.tabs button{flex:1;background:none;padding:8px 0 10px;color:#8A97B2;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button.on{color:var(--p);font-weight:700}
.tabs svg{width:22px;height:22px}
.card{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 3px 10px #0b4fd61a;margin-bottom:12px}
.st{font-size:17px;font-weight:700;color:var(--pd)}
.mu{font-size:12px;color:var(--mu)}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.bar{height:8px;background:var(--ln);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:4px}
.btn{background:var(--p);color:#fff;font-weight:700;border-radius:14px;padding:11px 14px;width:100%;font-size:15px}
.btn2{background:var(--pl);color:var(--p);font-weight:700;border-radius:14px;padding:9px 12px;font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.chip{background:var(--pl);color:var(--p);font-weight:700;border-radius:18px;padding:8px 13px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--p);color:#fff}
.fab{position:absolute;right:18px;bottom:72px;width:60px;height:60px;border-radius:30px;background:var(--a);color:#fff;font-size:32px;box-shadow:0 6px 16px #0b4fd655;z-index:5}
/* home */
.hdr{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;margin-bottom:12px}
.logo{display:flex;align-items:center;justify-content:center;gap:4px}
.logo b{font-size:28px;letter-spacing:1px;color:var(--pd)}.logo b span{color:var(--a)}
.tag{font-size:8px;font-weight:700;color:var(--pd);text-align:center;letter-spacing:.4px}
.bell{position:relative;justify-self:end;background:none;color:var(--pd)}
.badge{position:absolute;top:-4px;right:-4px;background:var(--r);color:#fff;font-size:10px;font-weight:700;border-radius:9px;min-width:18px;height:18px;display:grid;place-items:center}
.hero{position:relative;border-radius:20px;overflow:hidden;height:176px;margin-bottom:12px}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hero .msg{position:absolute;left:12px;top:50%;transform:translateY(-50%);background:var(--hero);border-radius:14px;padding:10px 14px;max-width:62%}
.hero .msg h2{font-size:20px;color:var(--pd)}
.hero .msg p{font-size:12.5px;margin-top:4px}
.hero .dt{position:absolute;right:14px;bottom:10px;color:#fff;font-weight:700;text-align:right;text-shadow:0 1px 4px #0006}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.sum .card{margin:0;text-align:center;padding:12px 8px;cursor:pointer}
.sum .e{font-size:24px}.sum .n{font-size:13px;font-weight:700}.sum .v{font-size:19px;font-weight:700;margin:2px 0}
.mods{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:12px}
.tablet .mods{grid-template-columns:repeat(6,1fr)}
.mod{background:var(--card);border-radius:16px;box-shadow:0 3px 10px #0b4fd61a;height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12px;text-align:center;padding:4px;color:var(--tx)}
.mod .e{font-size:26px}
.mod.wide{grid-column:1/-1;height:64px;flex-direction:row;gap:14px;font-size:14px;text-align:left;background:linear-gradient(135deg,#1B7F4B,#22B573);color:#fff}
.mod.wide small{font-size:11.5px;opacity:.9}
.home-grid{display:block}
.tablet .home-grid{display:grid;grid-template-columns:3fr 2fr;gap:16px;align-items:start}
.rem{display:grid;grid-template-columns:28px 46px 26px 1fr;align-items:center;gap:6px;padding:6px 0;font-size:14px}
.chk{width:24px;height:24px;border-radius:12px;border:2px solid var(--p);background:var(--card);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center}
.chk.on{background:var(--g);border-color:var(--g)}
.done{color:#8A97B2;text-decoration:line-through}
/* lists */
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.li:last-child{border-bottom:0}
.li .e{font-size:20px;width:30px;text-align:center}
.li .t{font-weight:700;font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.tile{background:var(--pl);border-radius:12px;padding:8px 4px;text-align:center}
.tile .v{font-weight:700;color:var(--pd);font-size:15px}
.cols{display:block}
.tablet .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.tablet .cols>div>.card:last-child{margin-bottom:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
svg.ch{width:100%;height:auto;max-height:240px;display:block}
/* form */
.f label{display:block;font-size:13px;font-weight:700;color:var(--mu);margin:10px 0 4px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--ln);border-radius:10px;padding:10px;background:var(--card);font-size:15px}
.f textarea{min-height:70px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
/* sheet & toast */
.ov{position:absolute;inset:0;background:#0e1b3d66;display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--card);color:var(--tx);width:100%;border-radius:20px 20px 0 0;padding:10px 0 14px;max-height:80%;overflow:auto}
.sheet h4{text-align:center;color:var(--mu);font-size:13px;padding:6px 16px 10px}
.sheet button{display:block;width:100%;background:none;color:var(--tx);padding:13px 18px;text-align:left;font-size:15px;border-top:1px solid var(--ln)}
.sheet button.del{color:var(--r)}
.sheet button.x{text-align:center;color:var(--mu)}
.toast{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);background:#0E1B3Dee;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:30;max-width:85%;text-align:center}
.pre{white-space:pre-wrap;font-size:13.5px;line-height:1.5}
.splash{position:absolute;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s}
.splash .lg{animation:fi .6s ease both}.splash .sg{position:absolute;bottom:40px;text-align:center;animation:fi .5s .5s ease both}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.note{font-size:12px;color:var(--mu);text-align:center;max-width:640px}
</style>
</head>
<body>
<div class="device" id="device">
  <div class="screen" id="screen">
    <div id="navwrap"></div>
    <div class="content" id="content"></div>
    <div id="fabwrap"></div>
    <nav class="tabs" id="tabs"></nav>
    <div id="overlay"></div>
  </div>
</div>
<input type="file" id="importFile" accept=".json,application/json" style="display:none">

<script>
// ───────── yardımcılar ─────────
const TR='tr-TR';
const $=s=>document.querySelector(s);
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const addM=(d,n)=>new Date(d.getFullYear(),d.getMonth()+n,1);
const sameDay=(a,b)=>a.toDateString()===b.toDateString();
const inR=(d,s,e)=>d>=s&&d<e;
const money=(v,dec=2)=>'₺ '+v.toLocaleString(TR,{minimumFractionDigits:dec,maximumFractionDigits:dec});
const num=(v,d=1)=>v==null?'—':v.toLocaleString(TR,{maximumFractionDigits:d});
const hm=d=>d.toLocaleTimeString(TR,{hour:'2-digit',minute:'2-digit'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=s=>{if(s==null||String(s).trim()==='')return null;let t=String(s).trim().replace(/\s/g,'');if(t.includes(',')&&t.includes('.'))t=t.replace(/\./g,'');const v=parseFloat(t.replace(',','.'));return isNaN(v)?null:v};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let uid=1;

// ───────── örnek veri ─────────
let S;
function seed(){
  const T=today(),rnd=(a,b)=>a+Math.random()*(b-a);
  S={user:'Troçki',goals:{water:2000,sleep:8,ex:30,cal:2000},health:[],water:[],meds:[],meals:[],fin:[],tasks:[],mods:[],rem:[],fav:[]};
  for(let i=45;i>=1;i--){const d=addD(T,-i);
    S.health.push({id:uid++,date:new Date(d.getTime()+8*36e5),w:+(76.4+i*0.05+rnd(-.3,.3)).toFixed(1),sys:Math.round(rnd(118,134)),dia:Math.round(rnd(74,86)),pulse:Math.round(rnd(64,80)),spo2:Math.round(rnd(96,99)),sleep:+rnd(6,8.5).toFixed(1),ex:Math.round(rnd(10,50)),note:''});
    S.water.push({date:new Date(d.getTime()+12*36e5),ml:Math.round(rnd(1200,2300)/100)*100});}
  S.health.push({id:uid++,date:new Date(T.getTime()+7.5*36e5),w:76.4,sys:124,dia:80,pulse:70,spo2:98,sleep:7.5,ex:30,note:'Sabah yürüyüşü yapıldı'});
  S.water.push({date:new Date(T.getTime()+9*36e5),ml:600},{date:new Date(T.getTime()+11*36e5),ml:400});
  S.meds.push({id:uid++,name:'Tansiyon ilacı',dose:'1 tablet',times:'08:00',active:true});
  S.meals.push({id:uid++,date:new Date(T.getTime()+8*36e5),type:'Kahvaltı',desc:'Menemen, peynir, zeytin, çay',cal:520},{id:uid++,date:new Date(T.getTime()+12.5*36e5),type:'Öğle Yemeği',desc:'Mercimek çorbası, salata',cal:450});
  for(let i=1;i<7;i++)S.meals.push({id:uid++,date:addD(T,-i),type:'Akşam Yemeği',desc:'Akşam yemeği',cal:Math.round(rnd(1500,2300))});
  const M0=addM(T,0);
  for(let m=-5;m<=0;m++){const ms=addM(M0,m);
    S.fin.push({id:uid++,inc:true,desc:'Emekli maaşı',amt:45750,date:new Date(ms.getFullYear(),ms.getMonth(),1,12),cat:'Emekli Maaşı'});
    [['Market',rnd(5500,7500)],['Faturalar',rnd(2500,3600)],['Kira',9000],['Ulaşım',rnd(1200,2200)],['Sağlık',rnd(400,1500)],['Yemek',rnd(1000,2200)]].forEach(([c,a],k)=>{
      const day=Math.min(3+k*4,m===0?Math.max(1,T.getDate()):27);
      S.fin.push({id:uid++,inc:false,desc:c==='Kira'?'Ev kirası':c,amt:Math.round(a),date:new Date(ms.getFullYear(),ms.getMonth(),day,12),cat:c})});}
  const tt=[['Faturayı öde','09:00',2,2],['Sabah yürüyüşü','07:30',1,2],['Kitap: 30 sayfa','',1,2],['Herodot notlarını düzenle','14:00',1,2],['Market alışverişi','17:00',0,2],['VİTANEX testleri','20:00',2,1],['İlaç reçetesi yenile','',2,0],['Annemi ara','19:00',1,0]];
  tt.forEach(([t,h,p,s])=>S.tasks.push({id:uid++,title:t,date:T,time:h,pri:p,status:s}));
  S.tasks.push({id:uid++,title:'Doktor randevusu',date:addD(T,2),time:'10:30',pri:2,status:0});
  S.mods.push(
    {id:uid++,mod:'education',kind:'Kitap',title:'Herodot — Tarih',prog:65,status:1,note:'IV. kitaptayım'},
    {id:uid++,mod:'education',kind:'Kurs',title:'.NET MAUI ile Android',prog:40,status:1},
    {id:uid++,mod:'development',kind:'Alışkanlık',title:'Her gün 20 dk okuma',prog:70,status:1},
    {id:uid++,mod:'development',kind:'Kişisel Proje',title:'VİTANEX uygulaması',prog:55,status:1},
    {id:uid++,mod:'social',kind:'Etkinlik',title:'Konser — Cemal Reşit Rey',date:addD(T,5),prog:0,status:0},
    {id:uid++,mod:'social',kind:'Görüşme',title:'Eski arkadaşlarla buluşma',date:addD(T,9),prog:0,status:0},
    {id:uid++,mod:'career',kind:'Proje',title:'MARKETPOS arayüz yenileme',prog:35,status:1},
    {id:uid++,mod:'career',kind:'Fikir',title:'Tarım danışmanlık sitesi',prog:10,status:0});
  [['08:00','💧','Su iç (200 ml)',true],['09:00','🚶','Sabah yürüyüşü (30 dk)',true],['12:00','🍽️','Öğle yemeği',true],['15:00','📖','Kitap oku (15 dk)',false]]
   .forEach(([t,i,x,d])=>S.rem.push({id:uid++,time:t,icon:i,title:x,active:true,done:d?today().toDateString():null}));
}

// ───────── hesaplar ─────────
function score(recs,ml){
  const g=S.goals;const w=Math.min(1,ml/g.water);
  const sl=Math.min(1,Math.max(0,...recs.map(r=>r.sleep||0))/g.sleep);
  const ex=Math.min(1,recs.reduce((a,r)=>a+(r.ex||0),0)/g.ex);
  return Math.round((w+sl+ex)/3*100);
}
function dayScore(d){const r=S.health.filter(x=>sameDay(x.date,d)),w=S.water.filter(x=>sameDay(x.date,d));return(r.length||w.length)?score(r,w.reduce((a,x)=>a+x.ml,0)):null}
function periodScore(s,e){const vals=[];for(let d=new Date(s);d<e;d=addD(d,1)){const v=dayScore(d);if(v!=null)vals.push(v)}return vals.length?Math.round(vals.reduce((a,b)=>a+b)/vals.length):null}
function buckets(p){const T=today(),L=[];
  if(p==='d')for(let i=6;i>=0;i--){const d=addD(T,-i);L.push([d.toLocaleDateString(TR,{weekday:'short'}),d,addD(d,1)])}
  else if(p==='w'){const mon=addD(T,-((T.getDay()+6)%7));for(let i=7;i>=0;i--){const s=addD(mon,-7*i);L.push([s.toLocaleDateString(TR,{day:'2-digit',month:'2-digit'}),s,addD(s,7)])}}
  else if(p==='m'){for(let i=11;i>=0;i--){const s=addM(T,-i);L.push([s.toLocaleDateString(TR,{month:'short'}),s,addM(s,1)])}}
  else for(let i=4;i>=0;i--){const s=new Date(T.getFullYear()-i,0,1);L.push([String(s.getFullYear()),s,new Date(s.getFullYear()+1,0,1)])}
  return L}

// ───────── grafikler (SVG) ─────────
let dark=false;
const K=()=>dark?{ln:'#2A3854',mu:'#8D9BBB',card:'#18233A',pd:'#8FB8FF'}:{ln:'#E3EAF5',mu:'#8A97B2',card:'#fff',pd:'#0A2E8A'};
function setDark(v){dark=v;$('#screen').classList.toggle('dark',v);document.body.classList.toggle('dark',v);try{localStorage.setItem('tv_theme',v?'dark':'light')}catch(e){}render()}
function short(v){const a=Math.abs(v);return a>=1e6?num(v/1e6)+'M':a>=1e3?num(v/1e3)+'B':num(v)}
function grid(L,R,T,B,min,max){let s='';for(let i=0;i<=4;i++){const y=B-(B-T)*i/4;s+=`<line x1="${L}" x2="${R}" y1="${y}" y2="${y}" stroke="${K().ln}"/><text x="${L-5}" y="${y+3.5}" font-size="9.5" fill="${K().mu}" text-anchor="end">${short(min+(max-min)*i/4)}</text>`}return s}
function barChart(labels,series,h=190,empty='Bu dönemde veri yok'){
  const W=340,L=38,R=W-6,T=8,B=h-22;const max=Math.max(0,...series.flatMap(s=>s.v))*1.1;
  if(!labels.length||max<=0)return`<svg class="ch" viewBox="0 0 ${W} ${h}"><text x="${W/2}" y="${h/2}" text-anchor="middle" fill="${K().mu}" font-size="13">${empty}</text></svg>`;
  const n=labels.length,slot=(R-L)/n,bw=Math.min(24,slot*.72/series.length);let s=grid(L,R,T,B,0,max);
  labels.forEach((lb,i)=>{const x0=L+slot*i+(slot-bw*series.length)/2;
    series.forEach((se,k)=>{const v=se.v[i];if(v>0){const hh=v/max*(B-T);s+=`<rect x="${x0+k*bw+1}" y="${B-hh}" width="${bw-2}" height="${hh}" rx="${Math.min(4,hh/2)}" fill="${se.c}"><title>${esc(lb)}: ${se.fmt?se.fmt(v):num(v)}</title></rect>`}});
    s+=`<text x="${L+slot*i+slot/2}" y="${B+15}" font-size="9.5" fill="${K().mu}" text-anchor="middle">${esc(lb)}</text>`});
  return`<svg class="ch" viewBox="0 0 ${W} ${h}">${s}</svg>`}
function lineChart(labels,vals,color,h=180,zero=false,empty='Veri yok'){
  const W=340,L=38,R=W-10,T=8,B=h-22;const v=vals.filter(x=>x!=null);
  if(!v.length)return`<svg class="ch" viewBox="0 0 ${W} ${h}"><text x="${W/2}" y="${h/2}" text-anchor="middle" fill="${K().mu}" font-size="13">${empty}</text></svg>`;

let stack=[{p:'home'}],tab='home',st={};
const TITLES={health:'Sağlık',nutrition:'Beslenme',finance:'Finans',backup:'Yedekleme',settings:'Ayarlar',reminders:'Hatırlatıcılar',stats:'İstatistikler',tasks:'Görevler',reports:'Raporlar',plants:'Şifalı Bitkiler'};
function go(p,a={}){
  if(['home','stats','tasks','reports'].includes(p)){tab=p;stack=[{p}]}
  else if(MODINFO[p])stack.push({p:'module',key:p});
  else stack.push({p,...a});
  render();$('#content').scrollTop=0}
function back(){if(stack.length>1)stack.pop();render()}
function cur(){return stack[stack.length-1]}
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;$('#screen').appendChild(el);setTimeout(()=>el.remove(),2200)}
function sheet(title,opts){ // opts: [label, fn, cls]
  const ov=$('#overlay');ov.innerHTML=`<div class="ov"><div class="sheet"><h4>${esc(title)}</h4>${opts.map((o,i)=>`<button data-i="${i}" class="${o[2]||''}">${esc(o[0])}</button>`).join('')}<button class="x" data-i="-1">Vazgeç</button></div></div>`;
  ov.querySelector('.ov').onclick=e=>{const b=e.target.closest('button');if(e.target.classList.contains('ov')||b){ov.innerHTML='';if(b&&b.dataset.i>=0)opts[b.dataset.i][1]()}}}
function alertBox(title,msg){sheet(title+'\n',[[msg,()=>{}]])}

// ───────── form ─────────
function form(title,fields,vals,onSave,extra=''){
  stack.push({p:'form',title,fields,vals,onSave,extra});render()}
function renderForm(c){
  const fh=c.fields.map(f=>{const v=c.vals[f.k]??'';const lab=`<label>${esc(f.l)}</label>`;
    if(f.t==='select')return lab+`<select data-k="${f.k}">${f.o.map(o=>`<option ${o==v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    if(f.t==='textarea')return lab+`<textarea data-k="${f.k}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;
    if(f.t==='range')return`<label>${esc(f.l)}: <b id="rv">%${v||0}</b></label><input type="range" min="0" max="100" step="5" value="${v||0}" data-k="${f.k}" oninput="rv.textContent='%'+this.value">`;
    return lab+`<input data-k="${f.k}" type="${f.t||'text'}" ${f.t==='num'?'inputmode="decimal"':''} value="${esc(v)}" placeholder="${esc(f.ph||'')}">`}).join('');
  return`${c.extra}<div class="card f">${fh}</div><button class="btn" id="save">Kaydet</button>`}
function bindForm(c){
  const sv=$('#save');if(!sv)return;
  sv.onclick=()=>{const out={};document.querySelectorAll('[data-k]').forEach(el=>out[el.dataset.k]=el.value);
    const err=c.onSave(out);if(err){toast(err);return}stack.pop();render();toast('Kaydedildi ✓')}}
const dIn=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};

const fromIn=(ds,ts)=>{const[y,m,d]=ds.split('-').map(Number);const[h,mi]=(ts||'12:00').split(':').map(Number);return new Date(y,m-1,d,h||0,mi||0)};

  <div class="card"><span class="st">Tamamlanan Görevler</span>${barChart(lab,[{v:B.map(b=>S.tasks.filter(t=>t.status===2&&inR(t.date,b[1],b[2])).length),c:'#FF8A1F'}],180,'Tamamlanan görev yok')}</div>

pages.reports=()=>{

   <label>Dönem</label><div class="chips" style="margin:0">${[['week','Bu hafta'],['month','Bu ay'],['last','Geçen ay'],['3m','Son 3 ay'],['year','Bu yıl']].map(x=>`<button class="chip ${r.range===x[0]?'on':''}" onclick="st.rep={...(st.rep||{type:0}),range:'${x[0]}',txt:null};render()">${x[1]}</button>`).join('')}</div>

window.buildRep=()=>{const r=st.rep||{type:0,range:'month'},T=today(),M=addM(T,0);
  const[s,e]={week:[addD(T,-((T.getDay()+6)%7)),addD(T,1)],month:[M,addD(T,1)],last:[addM(M,-1),M],'3m':[addM(M,-2),addD(T,1)],year:[new Date(T.getFullYear(),0,1),addD(T,1)]}[r.range];
  const L=[],sec=(t,rows)=>{L.push('■ '+t);rows.forEach(x=>L.push('   '+x[0]+': '+x[1]));L.push('')};
  const all=r.type===0;
  if(all||r.type===1){const h=S.health.filter(x=>inR(x.date,s,e)),w=h.filter(x=>x.w).sort((a,b)=>a.date-b.date),av=a=>a.length?num(a.reduce((x,y)=>x+y,0)/a.length):'—';
    sec('Sağlık',[['Kayıt sayısı',h.length],['Kilo (ilk → son)',w.length?`${num(w[0].w)} → ${num(w[w.length-1].w)} kg`:'—'],['Ortalama tansiyon',`${av(h.filter(x=>x.sys).map(x=>x.sys))}/${av(h.filter(x=>x.dia).map(x=>x.dia))}`],['Ortalama nabız',av(h.filter(x=>x.pulse).map(x=>x.pulse))],['Ortalama uyku',av(h.filter(x=>x.sleep).map(x=>x.sleep))+' saat'],['Toplam egzersiz',h.reduce((a,x)=>a+(x.ex||0),0)+' dk'],['Toplam su',num(S.water.filter(x=>inR(x.date,s,e)).reduce((a,x)=>a+x.ml,0)/1000)+' litre'],['Ortalama sağlık skoru','%'+(periodScore(s,e)??'—')]])}
  if(all||r.type===2){const f=S.fin.filter(x=>inR(x.date,s,e)),i=f.filter(x=>x.inc).reduce((a,x)=>a+x.amt,0),g=f.filter(x=>!x.inc).reduce((a,x)=>a+x.amt,0);const c={};f.filter(x=>!x.inc).forEach(x=>c[x.cat]=(c[x.cat]||0)+x.amt);
    sec('Finans',[['Toplam gelir',money(i)],['Toplam gider',money(g)],['Net durum',money(i-g)],['Tasarruf oranı',i?'%'+Math.round((i-g)/i*100):'—'],...Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>['  • '+k,money(v)])])}
  if(all||r.type===3){const t=S.tasks.filter(x=>inR(x.date,s,e)),d=t.filter(x=>x.status===2).length;sec('Görevler',[['Toplam',t.length],['Tamamlanan',d],['Devam eden',t.filter(x=>x.status===1).length],['Bekleyen',t.filter(x=>x.status===0).length],['Tamamlanma oranı',t.length?'%'+Math.round(d/t.length*100):'—']])}
  if(all||r.type===4){const m=S.meals.filter(x=>inR(x.date,s,e)),days=new Set(m.map(x=>x.date.toDateString())).size,c=m.reduce((a,x)=>a+(x.cal||0),0);sec('Beslenme',[['Kaydedilen öğün',m.length],['Toplam kalori',c.toLocaleString(TR)+' kcal'],['Günlük ortalama',days?Math.round(c/days).toLocaleString(TR)+' kcal':'—']])}
  if(all)sec('Eğitim · Gelişim · Sosyal · Kariyer',Object.keys(MODINFO).map(k=>{const l=S.mods.filter(x=>x.mod===k);return[MODINFO[k][0],`${l.length} kayıt, ${l.filter(x=>x.status===2).length} tamamlandı`]}));
  st.rep={...r,txt:L.join('\n').trim(),sub:`${s.toLocaleDateString(TR)} – ${addD(e,-1).toLocaleDateString(TR)}`};render()};

const TABS=[['home','Ana Sayfa'],['stats','İstatistikler'],['tasks','Görevler'],['reports','Raporlar']];
function render(){
  const c=cur(),p=c.p;
  $('#content').innerHTML=p==='form'?renderForm(c):pages[p](c);
  const title=p==='form'||p==='plant'?c.title:p==='module'?MODINFO[c.key][0]:TITLES[p];
  $('#navwrap').innerHTML=p==='home'?'':`<div class="nav">${stack.length>1?'<button onclick="back()">←</button>':''}<span>${esc(title)}</span></div>`;
  if(p==='plants'){const i=$('#pq');i.oninput=()=>{st.pq=i.value;$('#plist').innerHTML=plantList()}}
  if(p==='form')bindForm(c);
  if(c.isSettings){$('#save').onclick=()=>{const v={};document.querySelectorAll('[data-k]').forEach(el=>v[el.dataset.k]=el.value);S.user=v.user.trim()||'Troçki';['water','sleep','ex','cal'].forEach(k=>S.goals[k]=P(v[k])||S.goals[k]);toast('Ayarlar kaydedildi ✓')}}
  const fab=p!=='form'&&pages[p]&&pages[p].fab;$('#fabwrap').innerHTML=fab?'<button class="fab" id="fab">+</button>':'';if(fab)$('#fab').onclick=()=>pages[p].fab();
  $('#tabs').innerHTML=TABS.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="go('${t[0]}')">${ICON[t[0]]}${t[1]}</button>`).join('');
  save();
}

function empty(){S={user:'Troçki',goals:{water:2000,sleep:8,ex:30,cal:2000},health:[],water:[],meds:[],meals:[],fin:[],tasks:[],mods:[],rem:[],fav:[]};
  [['08:00','💧','Su iç (200 ml)'],['09:00','🚶','Sabah yürüyüşü (30 dk)'],['12:00','🍽️','Öğle yemeği'],['15:00','📖','Kitap oku (15 dk)']].forEach(([t,i,x])=>S.rem.push({id:uid++,time:t,icon:i,title:x,active:true,done:null}))}

function revive(o){['health','water','meals','fin','tasks','mods'].forEach(k=>(o[k]||[]).forEach(x=>{if(x.date)x.date=new Date(x.date)}));
