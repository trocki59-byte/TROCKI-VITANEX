<!doctype html>
<html lang="tr">
<head>

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<style>
:root{
  --nav:#fff;--hero:#ffffffbf;--p:#0B4FD6;--pd:#0A2E8A;--a:#1E88FF;--pl:#E6EEFC;--bg:#F2F6FC;--card:#fff;--tx:#0E1B3D;--mu:#5B6B8C;--ln:#E3EAF5;
  --g:#22B573;--o:#FF8A1F;--r:#F0384B;--stage:#DDE5F2;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--stage);font-family:Roboto,"Segoe UI",system-ui,sans-serif;color:var(--tx);-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0}
input,select,textarea{font:inherit;color:var(--tx)}
.stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px 16px 24px;gap:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.toolbar .t{font-weight:700;color:var(--pd);margin-right:6px}
.tb{background:#fff;color:var(--p);padding:8px 14px;border-radius:18px;font-weight:700;font-size:13px;box-shadow:0 1px 3px #0b4fd622}
.tb.on{background:var(--p);color:#fff}
.device{background:#0d1530;border-radius:38px;padding:10px;box-shadow:0 20px 50px #0a2e8a44;transition:width .25s}
.device.phone{width:min(400px,100%)}
.device.tablet{width:min(1080px,100%);border-radius:28px}
.screen{background:var(--bg);border-radius:30px;overflow:hidden;height:min(820px,calc(100vh - 90px));display:flex;flex-direction:column;position:relative}
.tablet .screen{border-radius:20px;height:min(720px,calc(100vh - 90px))}
.screen.dark{--bg:#0D1424;--card:#18233A;--tx:#E8EEFA;--mu:#9AA8C7;--ln:#2A3854;--pl:#1E2D4D;--pd:#8FB8FF;--nav:#121B2E;--hero:#121B2Ebf;--p:#3D7BFF}
.screen.dark .chip:not(.on),.screen.dark .btn2{color:var(--pd)}
.screen{color:var(--tx)}
html,body{background:var(--bg0,#F2F6FC)}
body.dark{--bg0:#0D1424}
.device,.device.tablet{width:100%!important;padding:0;border-radius:0;box-shadow:none;background:none}
.screen{border-radius:0!important;height:100vh!important;height:100dvh!important;max-width:100%}
.tablet .content{padding-left:max(18px,calc((100vw - 1280px)/2));padding-right:max(18px,calc((100vw - 1280px)/2))}
.tabs{padding-bottom:env(safe-area-inset-bottom)}
.fab{bottom:calc(72px + env(safe-area-inset-bottom))!important}
.screen{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
body{-webkit-user-select:none;user-select:none;overscroll-behavior:none}
input,textarea,select{-webkit-user-select:text;user-select:text;font-size:16px!important}
.ios-tip{position:absolute;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));background:var(--card);color:var(--tx);border-radius:16px;padding:12px 14px;box-shadow:0 8px 24px #0006;z-index:35;font-size:14px;display:flex;gap:10px;align-items:center}
.ios-tip b{color:var(--p)}
.ios-tip button{background:none;font-size:20px;color:var(--mu)}
@media print{body *{visibility:hidden}}
.sbar{background:var(--p);color:#fff;font-size:12px;display:flex;justify-content:space-between;padding:6px 18px;font-weight:600}
.nav{background:var(--nav);display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--ln);font-weight:700;font-size:18px;color:var(--pd)}
.nav button{background:none;font-size:24px;color:var(--pd);line-height:1;padding:0 6px}
.content{flex:1;overflow-y:auto;padding:14px 14px 90px}
.tabs{background:var(--nav);display:flex;border-top:1px solid var(--ln)}
.tabs button{flex:1;background:none;padding:8px 0 10px;color:#8A97B2;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button.on{color:var(--p);font-weight:700}
.tabs svg{width:22px;height:22px}
.card{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 3px 10px #0b4fd61a;margin-bottom:12px}
.st{font-size:17px;font-weight:700;color:var(--pd)}
.mu{font-size:12px;color:var(--mu)}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.bar{height:8px;background:var(--ln);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:4px}
.btn{background:var(--p);color:#fff;font-weight:700;border-radius:14px;padding:11px 14px;width:100%;font-size:15px}
.btn2{background:var(--pl);color:var(--p);font-weight:700;border-radius:14px;padding:9px 12px;font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.chip{background:var(--pl);color:var(--p);font-weight:700;border-radius:18px;padding:8px 13px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--p);color:#fff}
.fab{position:absolute;right:18px;bottom:72px;width:60px;height:60px;border-radius:30px;background:var(--a);color:#fff;font-size:32px;box-shadow:0 6px 16px #0b4fd655;z-index:5}
/* home */
.hdr{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;margin-bottom:12px}
.logo{display:flex;align-items:center;justify-content:center;gap:4px}
.logo b{font-size:28px;letter-spacing:1px;color:var(--pd)}.logo b span{color:var(--a)}
.tag{font-size:8px;font-weight:700;color:var(--pd);text-align:center;letter-spacing:.4px}
.bell{position:relative;justify-self:end;background:none;color:var(--pd)}
.badge{position:absolute;top:-4px;right:-4px;background:var(--r);color:#fff;font-size:10px;font-weight:700;border-radius:9px;min-width:18px;height:18px;display:grid;place-items:center}
.hero{position:relative;border-radius:20px;overflow:hidden;height:176px;margin-bottom:12px}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hero .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
.hero .photo.on{opacity:1}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,#0000 45%,#0006 100%)}
.hero .loc{position:absolute;left:14px;bottom:8px;color:#fff;font-size:11px;font-weight:600;text-shadow:0 1px 3px #000a;opacity:.9;text-decoration:none}
.hero .msg{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.tablet .hero{height:230px}
.hero .msg{position:absolute;left:12px;top:50%;transform:translateY(-50%);background:var(--hero);border-radius:14px;padding:10px 14px;max-width:62%}
.hero .msg h2{font-size:20px;color:var(--pd)}
.hero .msg p{font-size:12.5px;margin-top:4px}
.hero .dt{position:absolute;right:14px;bottom:10px;color:#fff;font-weight:700;text-align:right;text-shadow:0 1px 4px #0006}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.sum .card{margin:0;text-align:center;padding:12px 8px;cursor:pointer}
.sum .e{font-size:24px}.sum .n{font-size:13px;font-weight:700}.sum .v{font-size:19px;font-weight:700;margin:2px 0}
.mods{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:12px}
.tablet .mods{grid-template-columns:repeat(6,1fr)}
.mod{background:var(--card);border-radius:16px;box-shadow:0 3px 10px #0b4fd61a;height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12px;text-align:center;padding:4px;color:var(--tx)}
.mod .e{font-size:26px}
.mod.wide{grid-column:span 2;height:64px;flex-direction:row;gap:14px;font-size:14px;text-align:left;background:linear-gradient(135deg,#1B7F4B,#22B573);color:#fff}
.mod.wide small{font-size:11.5px;opacity:.9}
.tablet .mod.wide{grid-column:span 3}
.mod.st2{background:linear-gradient(135deg,#0B4FD6,#1E88FF)}
.pocket{position:absolute;inset:0;z-index:60;background:#000;color:#8FB8FF;display:flex;align-items:center;justify-content:center;text-align:center;touch-action:none;-webkit-user-select:none;user-select:none}
.pk-t{font-size:13px;letter-spacing:4px;font-weight:700;opacity:.6}.pk-n{font-size:72px;font-weight:800;color:#5E8FE0;line-height:1.1;margin-top:10px}
.pk-s{font-size:15px;opacity:.6;margin-top:2px}.pk-h{font-size:13px;opacity:.45;margin:40px 24px 30px;line-height:1.5}
.pk-u{position:relative;overflow:hidden;margin:0 auto;width:250px;border:1px solid #2A3854;border-radius:30px;padding:16px;font-size:14px;color:#8FB8FF}
.pk-u i{position:absolute;left:0;top:0;bottom:0;width:0;background:#1E2D4D}.pk-u.hold i{width:100%;transition:width 2s linear}.pk-u span{position:relative}
.ped-pill{position:absolute;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:30;background:#22B573;color:#fff;font-weight:700;font-size:13px;padding:6px 14px;border-radius:20px;box-shadow:0 4px 12px #0004;cursor:pointer}
.home-grid{display:block}
.tablet .home-grid{display:grid;grid-template-columns:3fr 2fr;gap:16px;align-items:start}
.rem{display:grid;grid-template-columns:28px 46px 26px 1fr;align-items:center;gap:6px;padding:6px 0;font-size:14px}
.chk{width:24px;height:24px;border-radius:12px;border:2px solid var(--p);background:var(--card);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center}
.chk.on{background:var(--g);border-color:var(--g)}
.done{color:#8A97B2;text-decoration:line-through}
/* lists */
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.li:last-child{border-bottom:0}
.li .e{font-size:20px;width:30px;text-align:center}
.li .t{font-weight:700;font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.tile{background:var(--pl);border-radius:12px;padding:8px 4px;text-align:center}
.tile .v{font-weight:700;color:var(--pd);font-size:15px}
.cols{display:block}
.tablet .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.tablet .cols>div>.card:last-child{margin-bottom:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
svg.ch{width:100%;height:auto;max-height:240px;display:block}
/* form */
.f label{display:block;font-size:13px;font-weight:700;color:var(--mu);margin:10px 0 4px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--ln);border-radius:10px;padding:10px;background:var(--card);font-size:15px}
.f textarea{min-height:70px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
/* sheet & toast */
.ov{position:absolute;inset:0;background:#0e1b3d66;display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--card);color:var(--tx);width:100%;border-radius:20px 20px 0 0;padding:10px 0 14px;max-height:80%;overflow:auto}
.sheet h4{text-align:center;color:var(--mu);font-size:13px;padding:6px 16px 10px}
.sheet button{display:block;width:100%;background:none;color:var(--tx);padding:13px 18px;text-align:left;font-size:15px;border-top:1px solid var(--ln)}
.sheet button.del{color:var(--r)}
.sheet button.x{text-align:center;color:var(--mu)}
.toast{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);background:#0E1B3Dee;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:30;max-width:85%;text-align:center}
.pre{white-space:pre-wrap;font-size:13.5px;line-height:1.5}
.splash{position:absolute;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s}
.splash .lg{animation:fi .6s ease both}.splash .sg{position:absolute;bottom:40px;text-align:center;animation:fi .5s .5s ease both}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.note{font-size:12px;color:var(--mu);text-align:center;max-width:640px}
</style>
</head>

</div>

<script>
// ───────── yardımcılar ─────────
const TR='tr-TR';
const $=s=>document.querySelector(s);
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const addM=(d,n)=>new Date(d.getFullYear(),d.getMonth()+n,1);
const sameDay=(a,b)=>a.toDateString()===b.toDateString();
const inR=(d,s,e)=>d>=s&&d<e;
const money=(v,dec=2)=>'₺ '+v.toLocaleString(TR,{minimumFractionDigits:dec,maximumFractionDigits:dec});
const num=(v,d=1)=>v==null?'—':v.toLocaleString(TR,{maximumFractionDigits:d});
const hm=d=>d.toLocaleTimeString(TR,{hour:'2-digit',minute:'2-digit'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=s=>{if(s==null||String(s).trim()==='')return null;let t=String(s).trim().replace(/\s/g,'');if(t.includes(',')&&t.includes('.'))t=t.replace(/\./g,'');const v=parseFloat(t.replace(',','.'));return isNaN(v)?null:v};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let uid=1;

// ───────── örnek veri ─────────
let S;
function seed(){
  const T=today(),rnd=(a,b)=>a+Math.random()*(b-a);
  const keepU=S?S.user:'',keepA=S?S.nameAsked:false;S={user:keepU,nameAsked:keepA,goals:{water:2000,sleep:8,ex:30,cal:2000,steps:8000,stride:72},health:[],water:[],meds:[],meals:[],fin:[],tasks:[],mods:[],rem:[],fav:[],steps:[],pays:[],notified:{}};
  for(let i=45;i>=1;i--){const d=addD(T,-i);
    S.health.push({id:uid++,date:new Date(d.getTime()+8*36e5),w:+(76.4+i*0.05+rnd(-.3,.3)).toFixed(1),sys:Math.round(rnd(118,134)),dia:Math.round(rnd(74,86)),pulse:Math.round(rnd(64,80)),spo2:Math.round(rnd(96,99)),sleep:+rnd(6,8.5).toFixed(1),ex:Math.round(rnd(10,50)),note:''});
    S.water.push({date:new Date(d.getTime()+12*36e5),ml:Math.round(rnd(1200,2300)/100)*100});}
  S.health.push({id:uid++,date:new Date(T.getTime()+7.5*36e5),w:76.4,sys:124,dia:80,pulse:70,spo2:98,sleep:7.5,ex:30,note:'Sabah yürüyüşü yapıldı'});
  S.water.push({date:new Date(T.getTime()+9*36e5),ml:600},{date:new Date(T.getTime()+11*36e5),ml:400});
  for(let i=20;i>=0;i--)S.steps.push({date:addD(T,-i),n:i?Math.round(rnd(4200,11500)):3450});
  [['Kredi Taksiti','Konut kredisi',8750,15,84],['Kredi Kartı','Kredi kartı ödemesi',4500,T.getDate()+1>28?28:T.getDate()+1,null],['KMH (Ek Hesap)','KMH faizi',650,5,null],['Aidat','Site aidatı',1200,10,null]]
   .forEach(([t,n,a,d,l])=>{const p={id:uid++,type:t,name:n,amt:a,day:d,left:l,active:true,paid:[],since:addM(T,-3).toISOString()};const dd=dueIn(p,addM(T,0));if(dd<T)p.paid.push(mKey(dd));p.paid.push(mKey(dueIn(p,addM(T,-1))));S.pays.push(p)});
  S.meds.push({id:uid++,name:'Tansiyon ilacı',dose:'1 tablet',times:'08:00',active:true});
  S.meals.push({id:uid++,date:new Date(T.getTime()+8*36e5),type:'Kahvaltı',desc:'Menemen, peynir, zeytin, çay',cal:520},{id:uid++,date:new Date(T.getTime()+12.5*36e5),type:'Öğle Yemeği',desc:'Mercimek çorbası, salata',cal:450});
  for(let i=1;i<7;i++)S.meals.push({id:uid++,date:addD(T,-i),type:'Akşam Yemeği',desc:'Akşam yemeği',cal:Math.round(rnd(1500,2300))});
  const M0=addM(T,0);
  for(let m=-5;m<=0;m++){const ms=addM(M0,m);
    S.fin.push({id:uid++,inc:true,desc:'Emekli maaşı',amt:45750,date:new Date(ms.getFullYear(),ms.getMonth(),1,12),cat:'Emekli Maaşı'});
    [['Market',rnd(5500,7500)],['Faturalar',rnd(2500,3600)],['Kira',9000],['Ulaşım',rnd(1200,2200)],['Sağlık',rnd(400,1500)],['Yemek',rnd(1000,2200)]].forEach(([c,a],k)=>{
      const day=Math.min(3+k*4,m===0?Math.max(1,T.getDate()):27);
      S.fin.push({id:uid++,inc:false,desc:c==='Kira'?'Ev kirası':c,amt:Math.round(a),date:new Date(ms.getFullYear(),ms.getMonth(),day,12),cat:c})});}
  const tt=[['Faturayı öde','09:00',2,2],['Sabah yürüyüşü','07:30',1,2],['Kitap: 30 sayfa','',1,2],['Herodot notlarını düzenle','14:00',1,2],['Market alışverişi','17:00',0,2],['VİTANEX testleri','20:00',2,1],['İlaç reçetesi yenile','',2,0],['Annemi ara','19:00',1,0]];
  tt.forEach(([t,h,p,s])=>S.tasks.push({id:uid++,title:t,date:T,time:h,pri:p,status:s}));
  S.tasks.push({id:uid++,title:'Doktor randevusu',date:addD(T,2),time:'10:30',pri:2,status:0});
  S.mods.push(
    {id:uid++,mod:'education',kind:'Kitap',title:'Herodot — Tarih',prog:65,status:1,note:'IV. kitaptayım'},
    {id:uid++,mod:'education',kind:'Kurs',title:'.NET MAUI ile Android',prog:40,status:1},
    {id:uid++,mod:'development',kind:'Alışkanlık',title:'Her gün 20 dk okuma',prog:70,status:1},
    {id:uid++,mod:'development',kind:'Kişisel Proje',title:'VİTANEX uygulaması',prog:55,status:1},
    {id:uid++,mod:'social',kind:'Etkinlik',title:'Konser — Cemal Reşit Rey',date:addD(T,5),prog:0,status:0},
    {id:uid++,mod:'social',kind:'Görüşme',title:'Eski arkadaşlarla buluşma',date:addD(T,9),prog:0,status:0},
    {id:uid++,mod:'career',kind:'Proje',title:'MARKETPOS arayüz yenileme',prog:35,status:1},
    {id:uid++,mod:'career',kind:'Fikir',title:'Tarım danışmanlık sitesi',prog:10,status:0});
  [['08:00','💧','Su iç (200 ml)',true],['09:00','🚶','Sabah yürüyüşü (30 dk)',true],['12:00','🍽️','Öğle yemeği',true],['15:00','📖','Kitap oku (15 dk)',false]]
   .forEach(([t,i,x,d])=>S.rem.push({id:uid++,time:t,icon:i,title:x,active:true,done:d?today().toDateString():null}));
}

// ───────── hesaplar ─────────
function score(recs,ml){
  const g=S.goals;const w=Math.min(1,ml/g.water);
  const sl=Math.min(1,Math.max(0,...recs.map(r=>r.sleep||0))/g.sleep);
  const ex=Math.min(1,recs.reduce((a,r)=>a+(r.ex||0),0)/g.ex);
  return Math.round((w+sl+ex)/3*100);
}
function dayScore(d){const r=S.health.filter(x=>sameDay(x.date,d)),w=S.water.filter(x=>sameDay(x.date,d));return(r.length||w.length)?score(r,w.reduce((a,x)=>a+x.ml,0)):null}
function periodScore(s,e){const vals=[];for(let d=new Date(s);d<e;d=addD(d,1)){const v=dayScore(d);if(v!=null)vals.push(v)}return vals.length?Math.round(vals.reduce((a,b)=>a+b)/vals.length):null}
function buckets(p){const T=today(),L=[];
  if(p==='d')for(let i=6;i>=0;i--){const d=addD(T,-i);L.push([d.toLocaleDateString(TR,{weekday:'short'}),d,addD(d,1)])}
  else if(p==='w'){const mon=addD(T,-((T.getDay()+6)%7));for(let i=7;i>=0;i--){const s=addD(mon,-7*i);L.push([s.toLocaleDateString(TR,{day:'2-digit',month:'2-digit'}),s,addD(s,7)])}}
  else if(p==='m'){for(let i=11;i>=0;i--){const s=addM(T,-i);L.push([s.toLocaleDateString(TR,{month:'short'}),s,addM(s,1)])}}
  else for(let i=4;i>=0;i--){const s=new Date(T.getFullYear()-i,0,1);L.push([String(s.getFullYear()),s,new Date(s.getFullYear()+1,0,1)])}
  return L}

function short(v){const a=Math.abs(v);return a>=1e6?num(v/1e6)+'M':a>=1e3?num(v/1e3)+'B':num(v)}
function grid(L,R,T,B,min,max){let s='';for(let i=0;i<=4;i++){const y=B-(B-T)*i/4;s+=`<line x1="${L}" x2="${R}" y1="${y}" y2="${y}" stroke="${K().ln}"/><text x="${L-5}" y="${y+3.5}" font-size="9.5" fill="${K().mu}" text-anchor="end">${short(min+(max-min)*i/4)}</text>`}return s}
function barChart(labels,series,h=190,empty='Bu dönemde veri yok'){
  const W=340,L=38,R=W-6,T=8,B=h-22;const max=Math.max(0,...series.flatMap(s=>s.v))*1.1;
  if(!labels.length||max<=0)return`<svg class="ch" viewBox="0 0 ${W} ${h}"><text x="${W/2}" y="${h/2}" text-anchor="middle" fill="${K().mu}" font-size="13">${empty}</text></svg>`;
  const n=labels.length,slot=(R-L)/n,bw=Math.min(24,slot*.72/series.length);let s=grid(L,R,T,B,0,max);
  labels.forEach((lb,i)=>{const x0=L+slot*i+(slot-bw*series.length)/2;
    series.forEach((se,k)=>{const v=se.v[i];if(v>0){const hh=v/max*(B-T);s+=`<rect x="${x0+k*bw+1}" y="${B-hh}" width="${bw-2}" height="${hh}" rx="${Math.min(4,hh/2)}" fill="${se.c}"><title>${esc(lb)}: ${se.fmt?se.fmt(v):num(v)}</title></rect>`}});
    s+=`<text x="${L+slot*i+slot/2}" y="${B+15}" font-size="9.5" fill="${K().mu}" text-anchor="middle">${esc(lb)}</text>`});
  return`<svg class="ch" viewBox="0 0 ${W} ${h}">${s}</svg>`}
function lineChart(labels,vals,color,h=180,zero=false,empty='Veri yok'){
  const W=340,L=38,R=W-10,T=8,B=h-22;const v=vals.filter(x=>x!=null);
  if(!v.length)return`<svg class="ch" viewBox="0 0 ${W} ${h}"><text x="${W/2}" y="${h/2}" text-anchor="middle" fill="${K().mu}" font-size="13">${empty}</text></svg>`;
  let min=zero?0:Math.min(...v),max=Math.max(...v);if(max-min<1e-4){min-=1;max+=1}const pad=(max-min)*.15;if(!zero)min-=pad;max+=pad;
  const n=labels.length,step=n>1?(R-L)/(n-1):0;let s=grid(L,R,T,B,min,max),pts=[];
  const every=Math.ceil(n/8);
  labels.forEach((lb,i)=>{const x=n>1?L+step*i:(L+R)/2;if(i%every===0||(i===n-1&&(n-1)%every>=every/2))s+=`<text x="${x}" y="${B+15}" font-size="9.5" fill="${K().mu}" text-anchor="middle">${esc(lb)}</text>`;
    if(vals[i]!=null)pts.push([x,B-(vals[i]-min)/(max-min)*(B-T),vals[i],lb])});
  s+=`<polyline points="${pts.map(p=>p[0]+','+p[1]).join(' ')}" fill="none" stroke="${color}" stroke-width="2.6" stroke-linejoin="round"/>`;
  pts.forEach(p=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${K().card}" stroke="${color}" stroke-width="2.4"><title>${esc(p[3])}: ${num(p[2])}</title></circle>`);
  return`<svg class="ch" viewBox="0 0 ${W} ${h}">${s}</svg>`}
function donut(p,c){const r=40,C=2*Math.PI*r,v=clamp(p||0,0,100);
  return`<svg viewBox="0 0 110 110" style="width:100%;max-width:110px;display:block;margin:auto"><circle cx="55" cy="55" r="${r}" fill="none" stroke="${K().ln}" stroke-width="11"/><circle cx="55" cy="55" r="${r}" fill="none" stroke="${c}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${C*v/100} ${C}" transform="rotate(-90 55 55)"/><text x="55" y="61" text-anchor="middle" font-size="19" font-weight="700" fill="${K().pd}">%${Math.round(v)}</text></svg>`}

let stack=[{p:'home'}],tab='home',st={};
const TITLES={health:'Sağlık',nutrition:'Beslenme',finance:'Finans',backup:'Yedekleme',settings:'Ayarlar',reminders:'Hatırlatıcılar',stats:'İstatistikler',tasks:'Görevler',reports:'Raporlar',plants:'Şifalı Bitkiler',steps:'Yürüme Sayar',menuplan:'Aylık Menü'};
function go(p,a={}){
  if(['home','stats','tasks','reports'].includes(p)){tab=p;stack=[{p}]}
  else if(MODINFO[p])stack.push({p:'module',key:p});
  else stack.push({p,...a});
  render();$('#content').scrollTop=0}
function back(){if(stack.length>1)stack.pop();render()}
function cur(){return stack[stack.length-1]}
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;$('#screen').appendChild(el);setTimeout(()=>el.remove(),2200)}
function sheet(title,opts){ // opts: [label, fn, cls]
  const ov=$('#overlay');ov.innerHTML=`<div class="ov"><div class="sheet"><h4>${esc(title)}</h4>${opts.map((o,i)=>`<button data-i="${i}" class="${o[2]||''}">${esc(o[0])}</button>`).join('')}<button class="x" data-i="-1">Vazgeç</button></div></div>`;
  ov.querySelector('.ov').onclick=e=>{const b=e.target.closest('button');if(e.target.classList.contains('ov')||b){ov.innerHTML='';if(b&&b.dataset.i>=0)opts[b.dataset.i][1]()}}}
function alertBox(title,msg){sheet(title+'\n',[[msg,()=>{}]])}

// ───────── form ─────────
function form(title,fields,vals,onSave,extra=''){
  stack.push({p:'form',title,fields,vals,onSave,extra});render()}
function renderForm(c){
  const fh=c.fields.map(f=>{const v=c.vals[f.k]??'';const lab=`<label>${esc(f.l)}</label>`;
    if(f.t==='select')return lab+`<select data-k="${f.k}">${f.o.map(o=>`<option ${o==v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    if(f.t==='textarea')return lab+`<textarea data-k="${f.k}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;
    if(f.t==='range')return`<label>${esc(f.l)}: <b id="rv">%${v||0}</b></label><input type="range" min="0" max="100" step="5" value="${v||0}" data-k="${f.k}" oninput="rv.textContent='%'+this.value">`;
    return lab+`<input data-k="${f.k}" type="${f.t||'text'}" ${f.t==='num'?'inputmode="decimal"':''} value="${esc(v)}" placeholder="${esc(f.ph||'')}">`}).join('');
  return`${c.extra}<div class="card f">${fh}</div><button class="btn" id="save">Kaydet</button>`}
function bindForm(c){
  const sv=$('#save');if(!sv)return;
  sv.onclick=()=>{const out={};document.querySelectorAll('[data-k]').forEach(el=>out[el.dataset.k]=el.value);
    const err=c.onSave(out);if(err){toast(err);return}stack.pop();render();toast('Kaydedildi ✓')}}
const dIn=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const tIn=d=>hm(new Date(d));
const fromIn=(ds,ts)=>{const[y,m,d]=ds.split('-').map(Number);const[h,mi]=(ts||'12:00').split(':').map(Number);return new Date(y,m-1,d,h||0,mi||0)};

  const M=addM(T,0),fin=S.fin.filter(f=>inR(f.date,M,addM(M,1)));
  const inc=fin.filter(f=>f.inc).reduce((a,f)=>a+f.amt,0),exp=fin.filter(f=>!f.inc).reduce((a,f)=>a+f.amt,0),net=inc-exp;
  const tt=S.tasks.filter(t=>sameDay(t.date,T)),done=tt.filter(t=>t.status===2).length;
  const rems=S.rem.filter(r=>r.active).sort((a,b)=>a.time.localeCompare(b.time));

  return`

  <div class="hero">${HERO}${heroPhoto(h)}<div class="msg"><h2>${g}${S.user?' '+esc(S.user):' 👋'}</h2><p>Bugün de kendin için güzel bir adım at. Daha sağlıklı, daha dengeli, daha üretken bir yaşam mümkün…</p></div>
    <div class="dt"><div style="font-size:17px">${now.toLocaleDateString(TR,{day:'numeric',month:'long',year:'numeric'})}</div><div>${now.toLocaleDateString(TR,{weekday:'long'})}</div></div></div>
  <div class="sum">
    <div class="card" onclick="go('health')"><div class="e">❤️</div><div class="n">Sağlık</div><div class="v" style="color:var(--g)">% ${hs}</div><div class="mu">Hedef: %100</div><div class="bar"><i style="width:${hs}%;background:var(--g)"></i></div></div>
    <div class="card" onclick="go('finance')"><div class="e">💰</div><div class="n">Finans</div><div class="v" style="color:${net<0?'var(--r)':'var(--p)'};font-size:16.5px">${money(net,0)}</div><div class="mu">Bu Ay (net)</div><div class="bar"><i style="width:${inc?clamp(net/inc*100,0,100):0}%;background:var(--a)"></i></div></div>
    <div class="card" onclick="go('tasks')"><div class="e">✅</div><div class="n">Görev</div><div class="v" style="color:var(--o)">${done} / ${tt.length}</div><div class="mu">Tamamlandı</div><div class="bar"><i style="width:${tt.length?done/tt.length*100:0}%;background:var(--o)"></i></div></div>
  </div>
  <div class="mods">${MODULES.map(m=>m[0]==='plants'?`<button class="mod wide" onclick="go('plants')"><span class="e">🌿</span><span><b>Şifalı Bitkiler</b><br><small>${PLANTS.length} bitki rehberi</small></span></button>`:m[0]==='steps'?`<button class="mod wide st2" onclick="go('steps')"><span class="e">👣</span><span><b>Yürüme Sayar</b><br><small>Bugün ${stepsOn(today()).toLocaleString(TR)} adım</small></span></button>`:`<button class="mod" onclick="go('${m[0]}')"><span class="e">${m[1]}</span>${m[2]}</button>`).join('')}</div>

  <div class="card"><div class="row"><span class="st">Bugünün Hatırlatıcıları</span><span class="sp"></span><a style="color:var(--a);font-weight:700;cursor:pointer;font-size:14px" onclick="go('reminders')">Tümünü Gör ›</a></div>
   ${payDue().map(p=>{const n=payDays(p);return`<div class="rem" style="cursor:pointer;background:${n<=0?'#F0384B18':'#FF8A1F18'};border-radius:10px;padding:6px 4px;margin-top:6px" onclick="go('finance')"><span style="font-size:18px;text-align:center">${payIcon(p.type)}</span><span style="font-weight:700;color:${n<=0?'var(--r)':'var(--o)'}">${n<0?'Gecikti':n===0?'Bugün':'Yarın'}</span><span></span><span><b>${esc(p.name)}</b> · ${money(p.amt,0)}</span></div>`}).join('')}
   <div style="margin-top:8px">${rems.length?rems.map(r=>{const d=r.done===T.toDateString();return`<div class="rem"><button class="chk ${d?'on':''}" onclick="togRem(${r.id})">${d?'✓':''}</button><span>${r.time}</span><span>${r.icon}</span><span class="${d?'done':''}">${esc(r.title)}</span></div>`}).join(''):'<p class="mu">Bugün için hatırlatıcı yok.</p>'}</div></div>

pages.home.fab=()=>sheet('Hızlı Ekle',[['❤️ Sağlık Kaydı',addHealth],['💧 Su (+200 ml)',()=>{S.water.push({date:new Date(),ml:200});render();toast('+200 ml su eklendi')}],['💰 Gelir / Gider',()=>addFin()],['✅ Görev',()=>addTask()],['🍽️ Öğün',()=>addMeal()],['👣 Adım Sayısı',()=>addSteps()],['⏰ Hatırlatıcı',()=>addRem()]]);
window.togRem=id=>{const r=S.rem.find(x=>x.id===id),T=today().toDateString();r.done=r.done===T?null:T;render()};
window.menu=()=>sheet('TROÇKİ VİTANEX',[['👣 Yürüme Sayar',()=>go('steps')],['🌿 Şifalı Bitkiler',()=>go('plants')],['Hatırlatıcılar',()=>go('reminders')],['Beslenme',()=>go('nutrition')],['Eğitim',()=>go('education')],['Kişisel Gelişim',()=>go('development')],['Sosyal Yaşam',()=>go('social')],['İş / Kariyer',()=>go('career')],['Yedekleme',()=>go('backup')],['Ayarlar',()=>go('settings')],[dark?'☀️ Açık tema':'🌙 Koyu tema',()=>setDark(!dark)]]);

  const pd=payDue().map(x=>{const k=payDays(x);return[`${payIcon(x.type)} ${k<0?'GECİKTİ':k===0?'BUGÜN':'Yarın'}: ${x.name} — ${money(x.amt,0)}`,()=>go('finance')]});

pages.health=()=>{
  const T=today(),tr=S.health.filter(r=>sameDay(r.date,T)),ml=S.water.filter(w=>sameDay(w.date,T)).reduce((a,w)=>a+w.ml,0);

// YÜRÜME SAYAR
function stepRec(d){d=new Date(d);d.setHours(0,0,0,0);let r=S.steps.find(x=>sameDay(x.date,d));if(!r){r={date:d,n:0};S.steps.push(r)}return r}
const stepsOn=d=>{const r=S.steps.find(x=>sameDay(x.date,d));return r?r.n:0};
const stepKm=n=>n*(S.goals.stride||72)/100000;
function stepKcal(n){const w=S.health.filter(x=>x.w).sort((a,b)=>b.date-a.date)[0];return Math.round(n*0.04*((w?w.w:70)/70))}
const PED={on:false,f:9.8,avg:9.8,up:false,last:0,wake:null,save:0,pend:0,walk:false,pocket:false};
function pedMotion(e){const a=e.accelerationIncludingGravity;if(!a||a.x==null)return;
  const m=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z);PED.f=PED.f*.75+m*.25;PED.avg=PED.avg*.97+PED.f*.03;
  const t=performance.now(),d=PED.f-PED.avg;
  if(!PED.up&&d>1.15){PED.up=true;pedPeak(t)}
  else if(PED.up&&d<0.25)PED.up=false}
// Ritim kontrolü: tek tük sarsıntıları saymaz; art arda 4 adım ritmi yakalanınca saymaya başlar
function pedPeak(t){const dt=t-PED.last;if(dt<280)return;PED.last=t;
  if(dt>2000){PED.pend=1;PED.walk=false;return}
  if(PED.walk){stepRec(today()).n++;pedUI();return}
  PED.pend=(PED.pend||0)+1;if(PED.pend>=4){stepRec(today()).n+=PED.pend;PED.walk=true;PED.pend=0;pedUI()}}
function pedUI(){const n=stepsOn(today());const g=S.goals.steps||8000;
  const el=$('#stepNow');if(el){el.textContent=n.toLocaleString(TR);$('#stepRing').innerHTML=stepRing(n,g,true);$('#stepKm').textContent=num(stepKm(n),2)+' km';$('#stepKcal').textContent=stepKcal(n)+' kcal'}
  const pill=$('#pedPill');if(pill)pill.querySelector('b').textContent=n.toLocaleString(TR);
  const pk=$('#pocketN');if(pk){pk.textContent=n.toLocaleString(TR);$('#pocketKm').textContent=num(stepKm(n),2)+' km · %'+Math.min(100,Math.round(n/g*100))}
  if(performance.now()-PED.save>4000){PED.save=performance.now();save()}}
window.pedToggle=async()=>{
  if(PED.on){PED.on=false;pocketOff();removeEventListener('devicemotion',pedMotion);try{PED.wake&&PED.wake.release()}catch(e){}PED.wake=null;save();render();toast('Yürüme sayar durduruldu');return}
  if(typeof DeviceMotionEvent==='undefined'){toast('Bu cihazda hareket sensörü yok');return}
  try{if(typeof DeviceMotionEvent.requestPermission==='function'){const p=await DeviceMotionEvent.requestPermission();if(p!=='granted'){alertBox('İzin gerekli','Adım saymak için "Hareket ve Yönelim" iznine "İzin Ver" deyin. Reddettiyseniz uygulamayı kapatıp yeniden açın.');return}}}
  catch(e){toast('Sensör izni alınamadı');return}
  PED.on=true;PED.f=PED.avg=9.8;PED.up=false;PED.pend=0;PED.walk=false;addEventListener('devicemotion',pedMotion);
  try{if('wakeLock' in navigator)PED.wake=await navigator.wakeLock.request('screen')}catch(e){}
  render();toast('Yürüme sayar başladı 👣')};
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState==='hidden'){save();if(PED.on)PED.hidAt=Date.now();return}
  if(PED.on){if('wakeLock' in navigator){try{PED.wake=await navigator.wakeLock.request('screen')}catch(e){}}
    if(PED.hidAt&&Date.now()-PED.hidAt>5000)toast('Ekran kapandığı için sayım bir süre durdu');PED.hidAt=0}});
// CEP MODU: ekranı karartır, cepteyken yanlış dokunuşları engeller
window.pocketOn=()=>{if(!PED.on)return;PED.pocket=true;const g=S.goals.steps||8000,n=stepsOn(today());
  const el=document.createElement('div');el.id='pocket';el.className='pocket';
  el.innerHTML=`<div class="pk-in"><div class="pk-t">👣 CEP MODU</div><div id="pocketN" class="pk-n">${n.toLocaleString(TR)}</div><div class="pk-s">adım</div><div id="pocketKm" class="pk-s">${num(stepKm(n),2)} km · %${Math.min(100,Math.round(n/g*100))}</div>
  <div class="pk-h">Telefonu cebinize koyun ve yürüyün.<br>Ekranı kilitlemeyin (yan tuşa basmayın).</div><div class="pk-u" id="pkU"><i></i><span>Açmak için 2 sn basılı tutun</span></div></div>`;
  $('#screen').appendChild(el);
  const u=$('#pkU');let tm=null;const start=e=>{e.preventDefault();u.classList.add('hold');tm=setTimeout(()=>{pocketOff();render()},2000)};const end=()=>{u.classList.remove('hold');clearTimeout(tm)};
  u.addEventListener('touchstart',start,{passive:false});u.addEventListener('mousedown',start);['touchend','touchcancel','mouseup','mouseleave'].forEach(x=>u.addEventListener(x,end));
  el.addEventListener('touchmove',e=>e.preventDefault(),{passive:false})};

function stepRing(n,g,big){const r=big?78:40,sw=big?14:10,S2=big?190:110,C=2*Math.PI*r,v=Math.min(1,n/g);

  <text x="${S2/2}" y="${S2/2-(big?6:0)}" text-anchor="middle" font-size="${big?34:18}" font-weight="700" fill="${K().pd}">%${Math.round(v*100)}</text>${big?`<text x="${S2/2}" y="${S2/2+22}" text-anchor="middle" font-size="12" fill="${K().mu}">hedef ${g.toLocaleString(TR)}</text>`:''}</svg>`}

window.healthImport=()=>{st.waitPaste=true;render();location.href='shortcuts://run-shortcut?name='+encodeURIComponent('VİTANEX Adim')};
function parseSteps(t){let s=String(t||'').replace(/[^\d.,]/g,'');if(!s)return null;
  const m=s.match(/[.,](\d{1,2})$/);if(m)s=s.slice(0,-m[0].length);   // 8234,0 → 8234
  s=s.replace(/[.,]/g,'');const n=parseInt(s,10);return isFinite(n)&&n>=0&&n<=200000?n:null}
window.healthPaste=async()=>{let t=null;
  try{t=await navigator.clipboard.readText()}catch(e){}
  if(t==null||t===''){t=prompt('Panodaki adım sayısını buraya yapıştırın:','')}
  const n=parseSteps(t);
  if(n==null){toast('Panoda adım sayısı bulunamadı. Kestirmeyi kontrol edin.');return}
  const r=stepRec(today()),old=r.n;r.n=n;st.waitPaste=false;render();
  toast(`❤️ Sağlık'tan alındı: ${n.toLocaleString(TR)} adım`+(old&&old!==n?` (önceki ${old.toLocaleString(TR)})`:''))};
window.addSteps=()=>form('Adım Sayısı',[{k:'d',l:'Tarih',t:'date'},{k:'n',l:'O günün toplam adımı',t:'num',ph:'örn. 7500'}],{d:dIn(today()),n:stepsOn(today())||''},
  v=>{const n=Math.round(P(v.n)||0);if(n<0||n>100000)return'Geçerli bir adım sayısı girin.';stepRec(fromIn(v.d)).n=n});
window.saveStepGoal=()=>{const g=Math.round(P($('#sgoal').value)||0),s=Math.round(P($('#sstride').value)||0);
  if(g<500||g>100000){toast('Hedef 500–100.000 arası olmalı');return}if(s<40||s>120){toast('Adım uzunluğu 40–120 cm olmalı');return}
  S.goals.steps=g;S.goals.stride=s;render();toast('Kaydedildi ✓')};


// DÜZENLİ ÖDEMELER (kredi, kart, KMH, kira, aidat…)
const PAYT=[['Kredi Taksiti','🏦'],['Kredi Kartı','💳'],['KMH (Ek Hesap)','🏧'],['Kira','🏠'],['Aidat','🏢'],['Fatura','🧾'],['Diğer','📌']];
const payIcon=t=>(PAYT.find(x=>x[0]===t)||PAYT[6])[1];
const payCat=t=>t==='Fatura'?'Faturalar':EXP.includes(t)?t:'Diğer';
const mKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
function dueIn(p,m){const last=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();return new Date(m.getFullYear(),m.getMonth(),Math.min(p.day,last))}
// Sıradaki (ödenmemiş) ödeme günü; geçen ay ödenmediyse onu gösterir
function payNext(p){const T=today(),M0=addM(T,0),prev=addM(M0,-1);
  const pd=dueIn(p,prev);if(p.since&&pd>=new Date(p.since)&&!p.paid.includes(mKey(pd)))return pd;
  let d=dueIn(p,M0);if(p.paid.includes(mKey(d)))d=dueIn(p,addM(M0,1));return d}
const payDays=p=>Math.round((payNext(p)-today())/864e5);
function payWhen(n){return n<0?`<b style="color:var(--r)">${-n} gün gecikti!</b>`:n===0?'<b style="color:var(--r)">BUGÜN</b>':n===1?'<b style="color:var(--o)">Yarın</b>':`${n} gün kaldı`}
const payDue=()=>S.pays.filter(p=>p.active&&payDays(p)<=1).sort((a,b)=>payDays(a)-payDays(b));

function paysCard(){const L=S.pays.filter(p=>p.active).sort((a,b)=>payDays(a)-payDays(b));
  const tot=L.reduce((a,p)=>a+p.amt,0),perm=('Notification' in window)?Notification.permission:'none';
  return`<div class="card"><div class="row"><span class="st">📅 Düzenli Ödemeler</span><span class="sp"></span><button class="btn2" onclick="addPay()">+ Ekle</button></div>
  <p class="mu" style="margin-top:4px">Aylık toplam: <b>${money(tot)}</b> · ${L.length} ödeme</p>
  ${L.length?L.map(p=>{const n=payDays(p),d=payNext(p);return`<div class="li" onclick="payTap(${p.id})"><span class="e">${payIcon(p.type)}</span><div style="flex:1;min-width:0"><div class="t">${esc(p.name)}</div><div class="mu">${p.type} · ödeme günü: ${p.day}${p.left!=null?` · kalan ${p.left} taksit`:''}</div><div style="font-size:12.5px;margin-top:2px">${d.toLocaleDateString(TR,{day:'numeric',month:'long'})} · ${payWhen(n)}</div></div><b style="color:var(--r);white-space:nowrap">${money(p.amt,0)}</b></div>`}).join(''):'<p class="mu" style="padding:10px 0">Kredi taksiti, kredi kartı, KMH, kira, aidat gibi her ay ödediklerinizi ekleyin; bir gün önce ve ödeme günü hatırlatılır.</p>'}
  ${L.length?`<button class="btn2" style="width:100%;margin-top:10px" onclick="payCal()">📅 Tümünü iPhone Takvimine Ekle (bildirim)</button>`:''}
  ${perm==='default'?`<button class="btn2" style="width:100%;margin-top:8px" onclick="payPerm()">🔔 Uygulama bildirimlerine izin ver</button>`:''}
  </div>`}

window.addPay=(p)=>form(p?'Ödemeyi Düzenle':'Yeni Düzenli Ödeme',[
  {k:'type',l:'Tür',t:'select',o:PAYT.map(x=>x[0])},
  {k:'name',l:'Açıklama',ph:'örn. Ziraat konut kredisi, Bonus kart, Ev kirası'},
  {k:'amt',l:'Aylık tutar (₺)',t:'num',ph:'4500'},
  {k:'day',l:'Ödeme günü (ayın kaçı? 1–31)',t:'num',ph:'15'},
  {k:'left',l:'Kalan taksit sayısı (kredi için, boş bırakılabilir)',t:'num',ph:'örn. 24'}],
  p?{type:p.type,name:p.name,amt:num(p.amt,2),day:p.day,left:p.left??''}:{type:'Kredi Taksiti',day:15},
  v=>{const a=P(v.amt),d=Math.round(P(v.day)||0),l=v.left===''||v.left==null?null:Math.round(P(v.left));
    if(!a||a<=0)return'Geçerli bir tutar girin.';if(d<1||d>31)return'Ödeme günü 1 ile 31 arasında olmalı.';if(l!=null&&(isNaN(l)||l<1))return'Kalan taksit 1 veya daha fazla olmalı.';
    const o={type:v.type,name:v.name.trim()||v.type,amt:a,day:d,left:l};
    if(p)Object.assign(p,o);else{const n={id:uid++,...o,active:true,paid:[],since:today().toISOString()};const d=dueIn(n,addM(today(),0));if(d<today())n.paid.push(mKey(d));S.pays.push(n)}});

window.payTap=id=>{const p=S.pays.find(x=>x.id===id),d=payNext(p);
  sheet(`${payIcon(p.type)} ${p.name} — ${money(p.amt,0)}`,[
    [`✓ Ödendi (${d.toLocaleDateString(TR,{day:'numeric',month:'long'})}) — gidere ekle`,()=>payDone(p)],
    ['📅 iPhone Takvimine ekle (bildirim)',()=>payCal([p])],
    ['Düzenle',()=>addPay(p)],
    ['Sil',()=>{S.pays.splice(S.pays.indexOf(p),1);render()},'del']])};

function payDone(p){const d=payNext(p);
  S.fin.push({id:uid++,inc:false,desc:p.name,amt:p.amt,date:new Date(),cat:payCat(p.type)});
  p.paid.push(mKey(d));if(p.paid.length>36)p.paid=p.paid.slice(-36);
  let msg=`✓ ${p.name} ödendi, gidere eklendi`;
  if(p.left!=null){p.left--;if(p.left<=0){p.active=false;msg=`🎉 ${p.name} bitti! Son taksit ödendi.`}}
  render();toast(msg)}

// ── iPhone Takvimi (.ics): bir gün önce 09:00 ve ödeme günü 09:00 bildirim ──
function icsEsc(s){return String(s).replace(/\\/g,'\\\\').replace(/[,;]/g,m=>'\\'+m).replace(/\n/g,'\\n')}
const icsD=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
function payICS(list){const now=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const ev=list.map(p=>{const d=payNext(p),last=p.day>28;
    const rule='FREQ=MONTHLY;'+(last?'BYMONTHDAY=-1':'BYMONTHDAY='+p.day)+(p.left!=null?';COUNT='+p.left:'');
    return['BEGIN:VEVENT','UID:vitanex-pay-'+p.id+'@trocki','DTSTAMP:'+now,'DTSTART;VALUE=DATE:'+icsD(d),'DTEND;VALUE=DATE:'+icsD(addD(d,1)),'RRULE:'+rule,
      'SUMMARY:'+icsEsc(`${payIcon(p.type)} ${p.name} — ${money(p.amt,0)}`),
      'DESCRIPTION:'+icsEsc(`${p.type} ödemesi · TROÇKİ VİTANEX`+(last?` · (ayın son günü)`:'')),
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(`Yarın ödeme: ${p.name} ${money(p.amt,0)}`),'TRIGGER:-PT15H','END:VALARM',
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(`Bugün ödeme günü: ${p.name} ${money(p.amt,0)}`),'TRIGGER:PT9H','END:VALARM','END:VEVENT'].join('\r\n')});
  return['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//TROCKI//VITANEX//TR','CALSCALE:GREGORIAN','METHOD:PUBLISH',...ev,'END:VCALENDAR'].join('\r\n')}
window.payCal=(list)=>{list=list||S.pays.filter(p=>p.active);if(!list.length)return;openICS(payICS(list),'VITANEX_odemeler.ics')};
function openICS(text,name){
  const blob=new Blob([text],{type:'text/calendar;charset=utf-8'}),url=URL.createObjectURL(blob);
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(ios){location.href=url}else{const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()}
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  toast('Açılan ekranda "Tümünü Ekle"ye dokunun')}

// ── Uygulama bildirimi (uygulama açıldığında) ──
window.payPerm=async()=>{try{const r=await Notification.requestPermission();toast(r==='granted'?'Bildirimler açıldı 🔔':'Bildirim izni verilmedi');payNotify();render()}catch(e){toast('Bu cihaz bildirimi desteklemiyor')}};
async function payNotify(){if(!('Notification' in window)||Notification.permission!=='granted')return;
  const key=today().toDateString();S.notified=S.notified||{};
  for(const p of payDue()){const id=p.id+'|'+key;if(S.notified[id])continue;S.notified[id]=1;
    const n=payDays(p),body=`${p.name} — ${money(p.amt,0)} (${n<0?-n+' gün gecikti':n===0?'bugün':'yarın'})`;
    try{const reg=await navigator.serviceWorker?.getRegistration();if(reg)await reg.showNotification('💳 Ödeme hatırlatma',{body,tag:'pay'+p.id,icon:'icon-192.png'});else new Notification('💳 Ödeme hatırlatma',{body})}catch(e){}}
  for(const k of Object.keys(S.notified))if(!k.endsWith(key))delete S.notified[k];save()}

window.askName=()=>{const ov=$('#overlay');ov.innerHTML=`<div class="ov"><div class="sheet" style="padding:22px 18px"><h4 style="font-size:20px;color:var(--pd)">👋 Hoş geldiniz!</h4>
  <p class="mu" style="font-size:14px;margin:6px 0 12px;line-height:1.45">Size nasıl hitap edelim? Adınız ana sayfada "Günaydın …" diye görünür. Sadece bu telefonda saklanır.</p>
  <input id="nameIn" class="nameIn" maxlength="30" placeholder="Adınız" value="${esc(S.user&&S.user!=='Troçki'?S.user:'')}" style="width:100%;border:1px solid var(--ln);border-radius:12px;padding:12px;font-size:17px;background:var(--card);color:var(--tx)">
  <button id="nameOk" style="margin-top:12px;background:var(--p);color:#fff;text-align:center;border-radius:14px;font-weight:700;border:0">Kaydet</button><button id="nameSkip" style="margin-top:4px;text-align:center;color:var(--mu);border:0">Şimdi değil</button></div></div>`;
  const done=v=>{S.user=v;S.nameAsked=true;ov.innerHTML='';render()};
  $('#nameOk').onclick=()=>done(($('#nameIn').value||'').trim());$('#nameSkip').onclick=()=>done(S.user==='Troçki'?'':S.user);
  setTimeout(()=>$('#nameIn')?.focus(),100)};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')payNotify()});
// ───────── iPhone / PWA ─────────
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
(function(){const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const standalone=navigator.standalone||matchMedia('(display-mode: standalone)').matches;let seen=null;try{seen=localStorage.getItem('tv_iostip')}catch(e){}
  if(!ios||standalone||seen)return;
  setTimeout(()=>{const el=document.createElement('div');el.className='ios-tip';
    el.innerHTML='<span style="font-size:26px">📲</span><div style="flex:1">iPhone\'a uygulama olarak kurun: alttaki <b>Paylaş ⬆︎</b> düğmesine, sonra <b>Ana Ekrana Ekle</b>\'ye dokunun.</div><button aria-label="Kapat">✕</button>';
    el.querySelector('button').onclick=()=>{el.remove();try{localStorage.setItem('tv_iostip','1')}catch(e){}};$('#screen').appendChild(el)},2600)})();
</script>
</body>
</html>
